services:
  trino:
    mem_limit: 6g
    volumes:
      - ./trino/config.capacity-v9.properties:/etc/trino/config.properties:ro
      - ./trino/catalog/lake.capacity-v6.properties:/etc/trino/catalog/lake.properties:ro
